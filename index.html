<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Crypto Collector 💰</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }
    #player {
      position: absolute;
      bottom: 20px;
      left: 50%;
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, gold, orange);
      border-radius: 50%;
      box-shadow: 0 0 25px gold;
      transform: translateX(-50%);
    }
    .coin {
      position: absolute;
      font-size: 36px;
      text-shadow: 0 0 8px gold, 0 0 16px orange;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #score {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 22px;
      font-weight: bold;
    }
    #username {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 20px;
      color: #aaa;
    }
    #wallet {
      position: absolute;
      bottom: 15px;
      left: 15px;
      font-size: 14px;
      background: rgba(255,215,0,0.1);
      border: 1px solid gold;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    #wallet:hover {
      background: rgba(255,215,0,0.2);
    }
    #leaderboard {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid gold;
      border-radius: 12px;
      padding: 10px 20px;
      max-width: 300px;
      font-size: 16px;
    }
    #leaderboard h3 {
      margin-top: 0;
      color: gold;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="score">💰 Skor: 0</div>
  <div id="username"></div>
  <div id="wallet">💳 Cüzdanı Bağla</div>
  <div id="leaderboard">
    <h3>🏆 Global Skor Tablosu</h3>
    <ul id="scoresList"></ul>
  </div>

  <!-- Farcaster SDK -->
  <script src="https://miniapp.farcaster.xyz/sdk.js"></script>

  <script>
    const player = document.getElementById("player");
    const scoreDisplay = document.getElementById("score");
    const usernameDisplay = document.getElementById("username");
    const walletButton = document.getElementById("wallet");
    const scoresList = document.getElementById("scoresList");

    let score = 0;
    let username = "Anon";
    let userWallet = null;

    let leaderboard = JSON.parse(localStorage.getItem("leaderboard") || "[]");

    // Farcaster SDK entegrasyonu
    const { user, wallet, social, notifications } = window.FarcasterMiniApp;

    async function init() {
      const currentUser = await user.getProfile();
      username = currentUser.username;
      usernameDisplay.textContent = "👋 " + username;
      notifications.send("Altınları toplamaya hazır mısın, " + username + "? 💰");
      renderLeaderboard();
    }

    init();

    // Cüzdan bağlantısı
    walletButton.addEventListener("click", async () => {
      try {
        const account = await wallet.getAddress();
        userWallet = account;
        walletButton.textContent = "🔗 " + account.slice(0, 6) + "..." + account.slice(-4);
        notifications.send("Cüzdan başarıyla bağlandı! 💳");
      } catch (err) {
        alert("Cüzdan bağlanamadı. Mini App izinlerini kontrol et!");
      }
    });

    // Oyuncu kontrolü
    document.addEventListener("mousemove", (e) => {
      player.style.left = e.clientX + "px";
    });

    // Coin üretme
    function spawnCoin() {
      const coin = document.createElement("div");
      coin.classList.add("coin");
      coin.textContent = "💰"; // altın sembolü
      coin.style.left = Math.random() * (window.innerWidth - 40) + "px";
      coin.style.top = "0px";
      document.body.appendChild(coin);

      let top = 0;
      const fall = setInterval(() => {
        top += 5;
        coin.style.top = top + "px";

        const playerRect = player.getBoundingClientRect();
        const coinRect = coin.getBoundingClientRect();

        // Çarpışma kontrolü
        if (
          coinRect.bottom >= playerRect.top &&
          coinRect.left < playerRect.right &&
          coinRect.right > playerRect.left
        ) {
          score++;
          scoreDisplay.textContent = "💰 Skor: " + score;
          coin.remove();
          clearInterval(fall);

          // Her 10 puanda paylaşım öner
          if (score % 10 === 0) {
            social.share(`${username} şu anda ${score} altın topladı! 💰`);
          }

          // Skor tablosunu güncelle
          updateLeaderboard(username, score);

          // 50 puanda ödül (örnek işlem)
          if (score === 50 && userWallet) {
            wallet.sendTransaction({
              to: userWallet, // oyuncunun kendi cüzdanına
              value: "0.0001" // ödül miktarı (örnek)
            });
            notifications.send("🎉 50 altın topladın! Cüzdanına ödül gönderildi!");
          }
        }

        if (top > window.innerHeight) {
          coin.remove();
          clearInterval(fall);
        }
      }, 30);
    }

    setInterval(spawnCoin, 900);

    // Skor tablosu işlemleri
    function updateLeaderboard(name, newScore) {
      const existing = leaderboard.find(p => p.name === name);
      if (existing) {
        existing.score = Math.max(existing.score, newScore);
      } else {
        leaderboard.push({ name, score: newScore });
      }
      leaderboard.sort((a, b) => b.score - a.score);
      leaderboard = leaderboard.slice(0, 5);
      localStorage.setItem("leaderboard", JSON.stringify(leaderboard));
      renderLeaderboard();
    }

    function renderLeaderboard() {
      scoresList.innerHTML = leaderboard
        .map(p => `<li>${p.name}: ${p.score} 💰</li>`)
        .join("");
    }
  </script>
</body>
</html>
